<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030a06">
<meta name="description" content="O espaço pessoal de Rafael Fernandes. Hello, friend.">
<title>Rafael Fernandes — hello, friend.</title>
<style>
:root{color-scheme:dark;--green:#66ff99;--muted:#79b88d;--line:#24623a;--bg:#030a06;font-family:'Courier New',monospace;font-size:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--green);padding:18px}body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.16) 3px,rgba(0,0,0,.16) 4px)}
.screen{min-height:calc(100svh - 36px);border:1px solid #3ae378;border-radius:15px;padding:28px 32px 22px;display:flex;flex-direction:column;max-width:1800px;margin:auto;box-shadow:inset 0 0 90px #0b271327}
header{display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{font-size:1.2rem;text-decoration:none}nav{display:flex;align-items:center;gap:28px}a,button{color:inherit}button{font:inherit;background:none;border:0;cursor:pointer;padding:8px 0}nav a,nav button{font-size:.875rem;text-decoration:none}a:hover,button:hover{color:#c4ffd6}a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:7px}.language{display:flex;align-items:center;gap:9px;border-left:1px solid var(--line);padding-left:24px}.language button[aria-pressed=false]{color:var(--muted)}.language button[aria-pressed=true]{text-decoration:underline;text-underline-offset:5px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:66px 26px 54px}.intro{min-width:0}.eyebrow{color:var(--muted);font-size:.875rem;letter-spacing:.14em;margin:0 0 24px}h1{font-size:clamp(2.8rem,5.8vw,6.5rem);line-height:1.05;letter-spacing:-.045em;font-weight:400;margin:0 0 30px;text-shadow:0 0 22px #66ff9920;position:relative;width:fit-content}h1 span{display:block}.hello{font-size:clamp(1.5rem,2.3vw,2.3rem);margin:0 0 28px}.cursor{animation:blink 1.2s step-end infinite}.description{color:#9fdbb1;line-height:1.8;max-width:31em;font-size:1rem;margin-bottom:28px}.about-link{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:5px}.computer{margin:0;min-width:0;justify-self:center;width:100%;max-width:640px}.computer pre{font:clamp(7px,.94vw,16px)/1.23 'Courier New',monospace;white-space:pre;margin:0;color:#59e98b;text-shadow:0 0 9px #41ff7724;user-select:text}.computer .code{color:#a5ffc3}footer{display:flex;align-items:center;gap:24px;font-size:.875rem;white-space:nowrap}footer .rule{height:1px;background:var(--line);flex:1}.glitch{animation:glitch .36s steps(1) 1}@keyframes glitch{0%,100%{transform:translate(0);text-shadow:none}20%{transform:translate(-2px,0);text-shadow:3px 0 #d7ffe2,-3px 0 #157c44}40%{transform:translate(2px,0);text-shadow:-4px 1px #42cd70}60%{transform:translate(0,-1px);text-shadow:3px 0 #b7ffce}80%{transform:translate(-1px,0)}}@keyframes blink{50%{opacity:0}}
dialog{background:#06120b;color:var(--green);border:1px solid var(--green);padding:30px;max-width:min(520px,calc(100vw - 40px));line-height:1.8}dialog::backdrop{background:#000b}dialog h2{font-size:1.25rem;font-weight:400}dialog button{border-bottom:1px solid var(--green);margin-top:16px}
/* Fit the composition to the available viewport, including mobile browser chrome. */
body{padding:clamp(8px,1.4vmin,18px)}
.screen{height:calc(100svh - clamp(16px,2.8vmin,36px));height:calc(100dvh - clamp(16px,2.8vmin,36px));min-height:0;padding:clamp(12px,2.4vmin,28px);gap:clamp(8px,1.8vmin,22px)}
header,footer{flex-shrink:0}
main{min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:0 clamp(0px,1.5vw,26px);gap:clamp(12px,2vw,28px)}
h1{font-size:clamp(2rem,min(5.8vw,11dvh),6.5rem);margin-bottom:clamp(10px,3dvh,30px)}
.eyebrow{margin-bottom:clamp(8px,2dvh,24px)}
.hello{font-size:clamp(1.1rem,min(2.3vw,4.5dvh),2.3rem);margin-bottom:clamp(8px,2dvh,28px)}
.description{margin:0 0 clamp(8px,2dvh,28px);line-height:1.5}
.computer{height:100%;max-width:640px;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.computer pre{font-size:min(16px,3.2cqw,2.5cqh);line-height:1.23;flex-shrink:0}
footer{gap:clamp(10px,2vw,24px)}
.footer-start{display:flex;flex-wrap:wrap;gap:0 1ch;text-align:left}#clock{white-space:pre;font-variant-numeric:tabular-nums}
@media(max-width:1000px){footer{flex-wrap:wrap}footer > span:last-child{margin-left:auto}}
dialog{max-height:calc(100dvh - 32px);overflow:auto}
@media(max-width:700px) and (orientation:portrait){
 header{display:grid;gap:6px}.brand{font-size:1rem}
 nav{justify-content:space-between;gap:8px;flex-wrap:nowrap}
 .language{gap:6px;padding-left:10px}
 main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:0}
 .intro{align-self:start}
 h1{font-size:clamp(2rem,min(10vw,7dvh),4.2rem);margin-bottom:10px}
 .eyebrow{margin-bottom:8px;letter-spacing:.08em}
 .hello{font-size:1.25rem;margin-bottom:8px}
 .description{margin-bottom:6px;max-width:25em}
 .computer{max-width:440px}
 footer{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.75rem}
 footer > span:last-child{grid-column:1 / -1;text-align:right}
}
@media(orientation:landscape) and (max-height:540px){
 .screen{padding:10px 16px;gap:8px}
 header{gap:12px}.brand{font-size:1rem}
 nav{gap:16px}.language{padding-left:12px;gap:6px}
 main{gap:16px;padding:0 8px}
 h1{font-size:clamp(1.8rem,min(5vw,10dvh),3.5rem);margin-bottom:8px}
 .eyebrow{margin-bottom:6px;font-size:.75rem;letter-spacing:.06em}
 .hello{font-size:1.125rem;margin-bottom:6px}
 .description{margin-bottom:4px;line-height:1.3}
 .about-link{padding:4px 0;font-size:.875rem}
 footer{font-size:.75rem}
}
/* Retain access when users enlarge text beyond the single-screen composition. */
@media(max-width:319px){header{display:grid;gap:4px}nav{flex-wrap:wrap}footer{white-space:normal}}
@media(prefers-reduced-motion:reduce){.cursor,.glitch{animation:none!important}}
</style>
</head>
<body>
<div class="screen">
<header><a class="brand" href="#home" aria-label="Home">rafael@home:~</a><nav aria-label="Principal"><button data-panel="about" data-i18n="about">SOBRE</button><button data-panel="interests" data-i18n="interests">INTERESSES</button><a href="mailto:rafaelrrf@gmail.com" data-i18n="contact">CONTATO</a><div class="language" aria-label="Idioma / Language"><button data-lang="pt" aria-pressed="true">PT</button><span>/</span><button data-lang="en" aria-pressed="false">EN</button></div></nav></header>
<main id="home"><section class="intro"><p class="eyebrow" data-i18n="personal">//BEM VINDO</p><h1 id="name"><span>RAFAEL</span><span>FERNANDES</span></h1><p class="hello">&gt; hello, friend.<span class="cursor" aria-hidden="true">_</span></p><p class="description" data-i18n="description">Ideias, histórias e o que me inspira.</p><button class="about-link" data-panel="about" data-i18n="more">[ SOBRE MIM ]</button></section>
<figure class="computer" role="img" aria-label="Computador dos anos 90 em arte ASCII, com teclado e código C na tela MS-DOS"><pre aria-hidden="true">             ___________________________________
            /__________________________________/|
           |  ______________________________  | |
           | |                              | | |
           | | <span class="code">C:\&gt; type hello.c</span>            | | |

           | | <span class="code">int main(void) {</span>             | | |
           | | <span class="code">  printf("Hello World.\n");</span>  | | |
           | | <span class="code">  return 0;</span>                  | | |
           | | <span class="code">}</span>                            | | |
           | |                              | | |
           | | <span class="code">C:\&gt;_</span>                        | | |
           | |______________________________| | |
           |                                  | /
           |                            ( o ) |/
           '--------------------.-------------'
                   ______|______|_____
          ________/___________________\________
         /____________________________________/|
        |  : : : : :       [____________]  [] | |
        |  : : : : :       [____________]     | /
        |_____________________________________|/
        ________________________________________
       / [] [] [] [] [] [] [] [] [] [] [] []    /|
      / [] [] [] [] [] [] [] [] [] [] []  []  / /
     / [] [] [] [] [] [] [] [] [] [] []  []  / /
    / [__] [] [] [____________] [] [] [___] / /
   /______________________________________/ /
   |______________________________________|/
</pre></figure></main>
<footer><span class="footer-start"><time id="clock"></time></span><span class="rule" aria-hidden="true"></span><span data-i18n="construction">//SEMPRE EM CONSTRUÇÃO</span></footer>
</div>
<dialog id="detail" aria-labelledby="panel-title"><h2 id="panel-title"></h2><p id="panel-copy"></p><button id="close" data-i18n="close">[ FECHAR ]</button></dialog>
<script>
const copy={pt:{contact:'CONTATO',about:'SOBRE',interests:'INTERESSES',personal:'//BEM VINDO',description:'Ideias, histórias e o que me inspira.',more:'[ SOBRE MIM ]',welcome:'// BEM VINDO',construction:'//SEMPRE EM CONSTRUÇÃO',close:'[ FECHAR ]',aboutText:'Sou Rafael Fernandes. Este é meu espaço pessoal — sempre em construção.',interestsText:'Computação, a estética dos PCs antigos e Mr. Robot.',computer:'Computador dos anos 90 em arte ASCII, com teclado e código C na tela MS-DOS'},en:{contact:'CONTACT',about:'ABOUT',interests:'INTERESTS',personal:'//WELCOME',description:'Ideas, stories, and what inspires me.',more:'[ ABOUT ME ]',welcome:'// WELCOME',construction:'//ALWAYS UNDER CONSTRUCTION',close:'[ CLOSE ]',aboutText:'I’m Rafael Fernandes. This is my personal space — always under construction.',interestsText:'Computing, the aesthetic of vintage PCs, and Mr. Robot.',computer:'1990s computer in ASCII art, with a keyboard and C code on an MS-DOS screen'}};
let language='pt',panel='about';const dialog=document.querySelector('#detail');
function updatePanel(){document.querySelector('#panel-title').textContent='> '+copy[language][panel];document.querySelector('#panel-copy').textContent=copy[language][panel+'Text'];}
function setLanguage(lang){language=lang;document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));document.querySelector('.computer').setAttribute('aria-label',copy[lang].computer);document.querySelector('nav').setAttribute('aria-label',lang==='pt'?'Principal':'Main');updatePanel();}
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>setLanguage(el.dataset.lang)));
document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',()=>{panel=el.dataset.panel;updatePanel();dialog.showModal();}));
document.querySelector('#close').addEventListener('click',()=>dialog.close());
const nameHeading=document.querySelector('#name');let lastGlitch=0;nameHeading.addEventListener('pointerenter',()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches||Date.now()-lastGlitch<1800)return;lastGlitch=Date.now();nameHeading.classList.add('glitch');});nameHeading.addEventListener('animationend',()=>nameHeading.classList.remove('glitch'));
const clock=document.querySelector('#clock');
function formatLocalTime(date){const pad=value=>String(value).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}  ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;}
function updateClock(){const now=new Date();const label=formatLocalTime(now);if(clock.textContent!==label){clock.textContent=label;clock.dateTime=now.toISOString();}}
updateClock();setInterval(updateClock,100);
</script>
</body>
</html>
